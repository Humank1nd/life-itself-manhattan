name: Cloud Times Square Geometry Capture

on:
  pull_request:
    paths:
      - "capture/**"
      - "scripts/cloud-capture-times-square.mjs"
      - ".github/workflows/cloud-times-square-capture.yml"
      - "data/times-square-building-versions-v1.json"
      - "data/city-scene-v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-times-square-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Hosted runner - current 2026 geometry, RGB/depth/building IDs
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: "true"
    steps:
      - name: Checkout immutable PR revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24 on ephemeral GitHub runner
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install render/test dependencies on hosted runner only
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
        run: npm install --no-save --no-package-lock --no-audit --no-fund three@0.160.0 pngjs@7.0.0 puppeteer@24.31.0

      - name: Render and verify nine synchronized passes
        env:
          CAPTURE_OUT: ${{ runner.temp }}/times-square-capture
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
        run: node scripts/cloud-capture-times-square.mjs

      - name: Upload ephemeral verified RGB/depth/building-ID artifact
        uses: actions/upload-artifact@v4
        with:
          name: manhattan-times-square-2026-geometry-${{ github.run_id }}
          path: ${{ runner.temp }}/times-square-capture/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
