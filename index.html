<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Itself — Manhattan Wireframe</title>
<style>
  html, body, #app { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #05070a; }
  #hud {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(10, 12, 16, 0.78); color: #f2f2f2;
    font-family: system-ui, sans-serif; padding: 10px 14px; border-radius: 8px;
    max-width: 460px; line-height: 1.45;
  }
  #hud h1 { font-size: 16px; margin: 0 0 4px; }
  #hud p { font-size: 13px; margin: 0; opacity: 0.85; }
  #atmo {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12px;
  }
  #atmo-label { opacity: 0.85; font-weight: 500; }
  #atmo-chips { display: flex; gap: 4px; }
  .atmo-chip {
    background: #13202f; color: #cfe6ff; border: 1px solid #2b6cb0;
    border-radius: 999px; padding: 2px 8px; font-size: 11px; cursor: pointer;
  }
  .atmo-chip.active { background: #2b6cb0; color: #ffffff; }
  #ask { display: flex; gap: 6px; margin-top: 10px; }
  #ask-input {
    flex: 1; min-width: 0; background: #0d1420; color: #f2f2f2;
    border: 1px solid #2b6cb0; border-radius: 6px; padding: 7px 9px; font-size: 13px;
  }
  #ask button {
    background: #2b6cb0; color: #fff; border: 0; border-radius: 6px;
    padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  #answer { margin-top: 8px; opacity: 1; }
  #pick { margin-top: 6px; }
  #city-status { margin-top: 8px; font-size: 12px; opacity: 0.85; }
  #city-toggle { margin-top: 5px; background: #13202f; color: #cfe6ff; border: 1px solid #2b6cb0; border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  #city-toggle:disabled { opacity: 0.5; cursor: default; }
  #journal { margin-top: 8px; font-size: 12px; opacity: 0.75; word-break: break-all; }
  #verify {
    background: #13202f; color: #cfe6ff; border: 1px solid #2b6cb0;
    border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; margin-top: 6px;
  }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    background: #13202f; color: #cfe6ff; border: 1px solid #2b6cb0;
    border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
</style>
<script>
  // Ask the Island model endpoint (deployed on Modal; the credential lives
  // server-side in a Modal secret — see endpoint/README.md). If the endpoint
  // is slow or down, the island answers with its local interpreter instead.
  window.ASK_ENDPOINT = "https://humank1nd--ask-the-island-ask-api.us-east.modal.run/ask";
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>Life Itself — Manhattan</h1>
  <p id="status">Drawing the island…</p>
  <div id="atmo">
    <span id="atmo-label">12:00 Solar Daylight</span>
    <div id="atmo-chips">
      <button type="button" class="atmo-chip active" data-hours="12">☀️ Noon</button>
      <button type="button" class="atmo-chip" data-hours="18.5">🌅 Dusk</button>
      <button type="button" class="atmo-chip" data-hours="23">🌙 Night</button>
    </div>
  </div>
  <form id="ask" autocomplete="off">
    <input id="ask-input" type="text" placeholder="Ask the island: pre-war buildings under 50 feet in the East Village">
    <button type="submit">Ask</button>
  </form>
  <p id="answer"></p>
  <div id="chips">
    <button type="button" class="chip">Pre-war buildings under 50 feet in the East Village</button>
    <button type="button" class="chip">Tallest building in Manhattan</button>
    <button type="button" class="chip">Oldest buildings in Harlem</button>
    <button type="button" class="chip">Buildings built after 2010 in the Financial District</button>
  </div>
  <p id="city-status" aria-live="polite">Living City: loading surveyed corridors…</p>
  <button type="button" id="city-toggle" disabled>Pause living city</button>
  <p id="pick">Click any building to see its record.</p>
  <p id="journal">Journal: the island's history is starting…</p>
  <button type="button" id="verify">Verify the island's history</button>
</div>
<script type="module" src="src/wireframe.js"></script>
</body>
</html>
